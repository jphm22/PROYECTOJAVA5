
<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css" integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Spartan:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/ffec4ec2ed.js" crossorigin="anonymous"></script>
    <title>Login - Delivery</title>
</head>
<body class="bg-dark">
<style>
    :root {
        --dark: #16191C;
        --dark-x: #1E2126;
        --light: #ffffff;
    }
    body {
        font-family: 'Spartan', sans-serif;
        font-weight: 300;
        color: var(--light);
    }
    .text-light { color: var(--light) !important; }
    .bg-dark { background-color: var(--dark) !important; }
    .bg-dark-x { background-color: var(--dark-x); }
    .btn {
        min-height: 3.125rem;
        font-weight: 600;
    }
    .form-control {
        min-height: 3.125rem;
        line-height: initial;
    }
    .form-control:focus {
        background-color: var(--dark-x);
        outline: none;
    }
    .img-1 {
        background-image: url('/Imagenes/Fondo1.jpg');
        background-size: cover;
        background-position: center;
    }
    .img-2 {
        background-image: url('/Imagenes/Fondo2.jpg');
        background-size: cover;
        background-position: center;
    }

    .logo-circle {
        width: 150px; /* Ajusta el tamaño del círculo */
        height: 150px; /* Asegúrate de que sea igual al ancho */
        border-radius: 50%; /* Esto crea el efecto circular */
        object-fit: cover; /* Asegura que la imagen se ajuste dentro del círculo */
        border: 5px solid white; /* Opcional: Agrega un borde alrededor */
    }

</style>
<section>
    <div class="row g-0">
        <div class="col-lg-7 d-none d-lg-block">
            <div id="carouselExampleCaptions" class="carousel slide" data-ride="carousel">
                <ol class="carousel-indicators">
                    <li data-target="#carouselExampleCaptions" data-slide-to="0" class="active"></li>
                    <li data-target="#carouselExampleCaptions" data-slide-to="1"></li>
                </ol>
                <div class="carousel-inner">
                    <div class="carousel-item img-1 min-vh-100 active">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 class="font-weight-bold">Sistema de administracion de entregas</h5>
                        </div>
                    </div>
                    <div class="carousel-item img-2 min-vh-100">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 class="font-weight-bold">Envios Seguros & Rápidos</h5>
                        </div>
                    </div>
                </div>
                <a class="carousel-control-prev" href="#carouselExampleCaptions" role="button" data-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="sr-only">Previous</span>
                </a>
                <a class="carousel-control-next" href="#carouselExampleCaptions" role="button" data-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="sr-only">Next</span>
                </a>
            </div>
        </div>
        <div class="col-lg-5 bg-dark d-flex flex-column align-items-end min-vh-100">
            <div class="px-lg-5 pt-lg-4 pb-lg-3 p-4 mb-auto w-100">
                <img src="Imagenes/logo_prueba.png" class="img-fluid logo-circle" />
            </div>
            <div class="align-self-center w-100 px-lg-5 py-lg-4 p-4">
                <h1 class="font-weight-bold mb-4">Bienvenido de vuelta</h1>
                <div th:if="${param.error}">
                    <div class="alert alert-danger">Usuario o contraseña
                        inválidos</div>
                </div>
                <div th:if="${param.logout}">
                    <div class="alert alert-info">Ha cerrado sesión exitosamente
                    </div>
                </div>
                <form class="mb-5" th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label for="exampleInputEmail1" class="form-label font-weight-bold">Usuario</label>
                        <input type="text" name="username" class="form-control bg-dark-x border-0" id="exampleInputEmail1" placeholder="Ingresa tu email" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-4">
                        <label for="exampleInputPassword1" class="form-label font-weight-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control bg-dark-x border-0 mb-2" placeholder="Ingresa tu contraseña" id="exampleInputPassword1">
                        <a href="" id="emailHelp" class="form-text text-muted text-decoration-none">¿Has olvidado tu contraseña?</a>
                    </div>
                    <button type="submit" value="Sign In" class="btn btn-primary w-100">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>
</section>
<!-- Optional JavaScript -->
<!-- Popper.js first, then Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js" integrity="sha384-oesi62hOLfzrys4LxRF63OJCXdXDipiYWBnvTl9Y9/TRlw5xlKIEHpNyvvDShgf/" crossorigin="anonymous"></script>
</body>
</html>
