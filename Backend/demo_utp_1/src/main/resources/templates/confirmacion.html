<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurrierFast SAC - Generar Factura</title>
    <link rel="icon" href="Imagenes/logo_prueba.png" type="image/png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilo de fondo degradado */
        body {
            background: linear-gradient(90deg, rgba(0, 201, 255, 1) 0%, rgba(146, 254, 157, 1) 100%);
            min-height: 100vh;
        }

        /* Estilo de los títulos y etiquetas */
        h1 {
            color: red;
        }

        label {
            color: black;
            font-weight: bold;
        }

        /* Espaciado en los botones */
        .btn {
            margin-top: 10px;
            font-weight: bold;
        }

        .navbar {
            background-color: transparent;
        }

        .navbar-nav .nav-link {
            color: white;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .table th, .table td {
            vertical-align: middle;
        }

        .btn-primary, .btn-success {
            background-color: #6e2aa3;
            border-color: #6e2aa3;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="Imagenes/logo_prueba.png" alt="CurrierFast SAC" style="width: 60px;"> CURRIERFAST SAC
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/envio/nuevo">Registros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/envios">Envíos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/confirmacion">Confirmación</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
    <!-- Sección de Datos del Cliente -->
    <div class="row mb-3">
        <div class="col-md-4">
            <label for="dni" class="form-label">DNI</label>
            <input type="text" class="form-control" id="dni" placeholder="">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-primary w-100" id="buscarBtn">Buscar</button>
        </div>
    </div>

    <!-- Tabla de Productos -->
    <div class="table-responsive mt-3">
        <table class="table table-bordered text-center">
            <thead class="table-primary">
            <tr>
                <th scope="col">PESO</th>
                <th scope="col">VOLUMEN</th>
                <th scope="col">SUBTOTAL</th>
                <th scope="col">ESTADO</th>
            </tr>
            </thead>
            <tbody id="enviosTabla">
            <!-- Aquí se llenarán los datos -->
            </tbody>
        </table>
    </div>

    <!-- Botones de Acciones -->
    <div class="row mt-4">
        <div class="col-md-2">
            <button type="button" class="btn btn-primary w-100" id="imprimirBtn">Imprimir Factura</button>
        </div>
        <div class="col-md-2 ms-auto">
            <label for="total" class="form-label">Total</label>
            <input type="text" class="form-control" id="total" placeholder="" readonly>
        </div>
    </div>

    <!-- Total -->
    <div class="row mt-3">
        <div class="col-md-2 ms-auto">
            <button type="button" class="btn btn-danger w-100" onclick="window.location.href='/logout'" >Salir</button>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Datos simulados
    const datosEnvios = [
        { dni: '12345678', peso: 5, volumen: 10 },
        { dni: '23456789', peso: 7, volumen: 15 },
        { dni: '34567890', peso: 3, volumen: 8 },
        { dni: '45678901', peso: 2, volumen: 5 },
        { dni: '56789012', peso: 8, volumen: 20 },
        { dni: '67890123', peso: 6, volumen: 12 },
        { dni: '78901234', peso: 9, volumen: 18 },
        { dni: '89012345', peso: 4, volumen: 9 },
    ];

    document.getElementById("buscarBtn").addEventListener("click", function() {
        const dni = document.getElementById("dni").value;
        const envio = datosEnvios.find(e => e.dni === dni);

        // Si encontramos el DNI en los datos simulados
        if (envio) {
            const subtotal = envio.peso * envio.volumen;

            // Limpiar la tabla antes de insertar los datos
            const tabla = document.getElementById("enviosTabla");
            tabla.innerHTML = `
                <tr>
                    <td>${envio.peso}</td>
                    <td>${envio.volumen}</td>
                    <td>${subtotal}</td>
                    <td>
                        <select class="form-select" id="estado">
                            <option value="recepcionado">Recepcionado</option>
                            <option value="entregado">Entregado</option>
                            <option value="en-camino">En Camino</option>
                        </select>
                    </td>
                </tr>
            `;

            // Actualizar el total
            actualizarTotal(subtotal);
        } else {
            alert("No se encontraron datos para este DNI");
        }
    });

    // Función para actualizar el total
    function actualizarTotal(subtotal) {
        let total = subtotal; // Solo un subtotal por ahora
        document.getElementById("total").value = total.toFixed(2);
    }

    // Función para imprimir la factura
    document.getElementById("imprimirBtn").addEventListener("click", function() {
        const tabla = document.querySelector("table");
        const ventana = window.open("", "_blank");
        ventana.document.write("<html><head><title>Factura</title></head><body>");
        ventana.document.write(tabla.outerHTML);
        ventana.document.write("</body></html>");
        ventana.document.close();
        ventana.print();
    });
</script>
</body>
</html>
