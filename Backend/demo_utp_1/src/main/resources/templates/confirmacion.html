<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurrierFast SAC - Generar Factura</title>
    <link rel="icon" href="Imagenes/logo_prueba.png" type="image/png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilo de fondo degradado */
        body {
            background: linear-gradient(90deg, rgba(0, 201, 255, 1) 0%, rgba(146, 254, 157, 1) 100%);
            min-height: 100vh;
        }

        /* Estilo de los títulos y etiquetas */
        h1 {
            color: red;
        }

        label {
            color: black;
            font-weight: bold;
        }

        /* Espaciado en los botones */
        .btn {
            margin-top: 10px;
            font-weight: bold;
        }

        .navbar {
            background-color: transparent;
        }

        .navbar-nav .nav-link {
            color: white;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .table th, .table td {
            vertical-align: middle;
        }

        .btn-primary, .btn-success {
            background-color: #6e2aa3;
            border-color: #6e2aa3;
        }



    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="Imagenes/logo_prueba.png" alt="CurrierFast SAC" style="width: 60px;"> CURRIERFAST SAC
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/envio/nuevo">Registros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/envios">Envíos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/confirmacion">Confirmación</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
    <!-- Sección de Datos del Cliente -->
    <div class="row mb-3">
        <div class="col-md-4">
            <label for="dni" class="form-label">DNI</label>
            <input type="text" class="form-control" id="dni" placeholder="">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-primary w-100">Buscar</button>
        </div>
    </div>

    <!-- Sección de Datos del Envío -->
    <div class="row mb-3">
        <div class="col-md-4">
            <label for="codigo" class="form-label">Código</label>
            <input type="text" class="form-control" id="codigo" placeholder="">
        </div>

    </div>

    <!-- Tabla de Productos -->
    <div class="table-responsive mt-3">
        <table class="table table-bordered text-center">
            <thead class="table-primary">
            <tr>
                <th scope="col">CÓDIGO</th>
                <th scope="col">DESCRIPCIÓN</th>
                <th scope="col">PRECIO</th>
                <th scope="col">CANTIDAD</th>
                <th scope="col">SUBTOTAL</th>
                <th scope="col">VOLUMEN</th>
                <th scope="col">SELECCIONAR</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>
                    <button type="button" class="btn btn-success">Agregar</button>
                </td>
            </tr>
            <!-- Más filas según sea necesario -->
            </tbody>
        </table>
    </div>

    <!-- Botones de Acciones -->
    <div class="row mt-4">
        <div class="col-md-2">
            <button type="button" class="btn btn-primary w-100">Imprimir Factura</button>
        </div>
        <div class="col-md-2">
            <button type="button" class="btn btn-primary w-100">Generar Factura</button>
        </div>
        <div class="col-md-2 ms-auto">
            <label for="total" class="form-label">Total</label>
            <input type="text" class="form-control" id="total" placeholder="">
        </div>
    </div>

    <!-- Total -->
    <div class="row mt-3">
        <div class="col-md-2 ms-auto">
            <button type="button" class="btn btn-danger w-100" onclick="window.location.href='/logout'" >Salir</button>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
