<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurrierFast SAC - Registro de datos</title>
  <link rel="icon" th:href="@{/Imagenes/logo_prueba.png}" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Tu estilo aquí */
    body {
      background: linear-gradient(90deg, rgba(0, 201, 255, 1) 0%, rgba(146, 254, 157, 1) 100%);
      color: white;
    }
    .navbar {
      background-color: transparent;
    }
    .navbar-nav .nav-link {
      color: white;
    }
    .custom-form {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }
    .form-label {
      color: rgb(236, 230, 230);
    }
    .form-control {
      border-radius: 20px;
    }
    .btn-registrar {
      background-color: rgb(60, 15, 224);
      color: white;
      font-weight: bold;
      border-radius: 20px;
      padding: 10px 40px;
    }
    .btn-consultar {
      background-color: #8bffa1;
      color: black;
      font-weight: bold;
      border-radius: 20px;
      padding: 10px 40px;
      margin-left: 10px; /* Espacio entre botones */
    }
    h2 {
      color: rgb(18, 13, 13);
      font-weight: bold;
      margin-bottom: 20px;
    }
    .cost-code-box {
      background-color: #bdb093;
      border-radius: 15px;
      padding: 10px 20px;
      color: black;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="#">
      <img th:src="@{/Imagenes/logo_prueba.png}" alt="." style="width: 60px;"/> CURRIERFAST SAC
    </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/envio/nuevo">Registros</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/envios">Envíos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/confirmacion">Confirmación</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container custom-form mt-5">
  <h2 class="text-center">Registro de datos</h2>
  <form th:action="@{/envio/guardar}" th:object="${envio}" method="post">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="nombreRemitente" class="form-label">Nombre del remitente</label>
        <input type="text" class="form-control" id="nombreRemitente" th:field="*{nombreRemitente}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="peso" class="form-label">Peso</label>
        <input type="text" class="form-control" id="peso" th:field="*{peso}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="dniRemitente" class="form-label">DNI remitente</label>
        <input type="text" class="form-control" id="dniRemitente" th:field="*{dniRemitente}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="volumen" class="form-label">Volumen</label>
        <input type="text" class="form-control" id="volumen" th:field="*{volumen}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="lugarEnvio" class="form-label">Lugar de envío</label>
        <input class="form-select" id="lugarEnvio" th:field="*{lugarEnvio}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="categoriaEnvio" class="form-label">Categoría de envío</label>
        <select class="form-select" id="categoriaEnvio">
          <option>Seleccionar</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label for="lugarDestino" class="form-label">Lugar de destino</label>
        <input class="form-select" id="lugarDestino" th:field="*{lugarDestino}" required>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-6">
        <div class="cost-code-box" id="costoEnvio">Costo de envío</div>
      </div>
      <div class="col-md-6">
        <div class="cost-code-box" id="codigoEnvio">Código</div>
      </div>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-registrar">Registrar</button>
      <button type="button" class="btn btn-consultar" onclick="consultar()">Consultar</button>
    </div>
  </form>

  <div class="text-end mt-3">
    <button type="button" class="btn btn-danger" onclick="window.location.href='/acceso'">Salir</button>
  </div>
  <a href="/envios">Volver al listado</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function generarCodigoAleatorio() {
    const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let codigo = '';
    for (let i = 0; i < 8; i++) {
      const indice = Math.floor(Math.random() * caracteres.length);
      codigo += caracteres[indice];
    }
    return codigo;
  }

  function consultar() {
    const peso = parseFloat(document.getElementById('peso').value);
    const volumen = parseFloat(document.getElementById('volumen').value);
    if (isNaN(peso) || isNaN(volumen)) {
      alert('Por favor, ingrese valores válidos para peso y volumen.');
      return;
    }
    const costoEnvio = peso + volumen; // Suponiendo que el costo es la suma de peso y volumen
    const codigoEnvio = generarCodigoAleatorio();

    document.getElementById('costoEnvio').innerText = `Costo de envío: ${costoEnvio}`;
    document.getElementById('codigoEnvio').innerText = `Código: ${codigoEnvio}`;
  }
</script>
</body>
</html>
