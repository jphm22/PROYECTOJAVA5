<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Inicio de sesión - CurrierFast</title>
    <link rel="icon" href="Imagenes/logo_prueba.png" type="image/png">
    <style>
        body {
            background-image: url('Imagenes/fondo_de_pantalla.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
        }
        .login-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 50px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }
        .logo-container {
            background-color: white;
            border: 2px solid #000;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .logo-container img {
            max-width: 100px;
            margin-right: 0px;
        }
        .btn-custom {
            background-color: #b11b1b;
            color: white;
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 50px;
            cursor: pointer;
        }
        .btn-custom:hover {
            background-color: #a30f0f;
        }
        .form-group {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container h-100 d-flex justify-content-start align-items-center">
        <div class="row">
            <div class="col-md-12">
                <div class="logo-container">
                    <img src="Imagenes/logo_prueba.png" alt="Logo">
                    <h1 class="text-dark">CURRIERFAST</h1>
                </div>
                <div class="login-container">
                    <form>
                        <h1 class="text-center text-danger form-group">Bienvenido</h1>
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="correo">Correo</label>
                            <input type="email" class="form-control" id="correo" placeholder="Correo" required>
                        </div>
                        <div class="form-group">
                            <label for="contraseña">Contraseña</label>
                            <input type="password" class="form-control" id="contraseña" placeholder="Contraseña" required>
                        </div>
                        <button type="button" class="btn-custom mt-3" onclick="window.location.href='registro.html'">REGISTRAR</button>
                        <button type="button" class="btn-custom mt-3" onclick="window.location.href='paginaPrincipal.html'">ENTRAR</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
